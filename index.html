<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual Guitar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="instructions-box">
    <h3>How to Play</h3>
    <p><strong>Click:</strong> Click on a fret to play a note.</p>
    <p><strong>Keyboard Chords:</strong> Use keys 'a', 's', 'd', etc. to play major chords. Hold Shift for minor chords.</p>
  </div>
  <div class="container">
    <h1>Virtual Guitar</h1>
    <div id="guitar-container">
      <div class="open-notes-container"></div>
      <div id="fretboard-container"></div>
    </div>
  </div>
  <script src="guitar.js"></script>
</body>
</html>
